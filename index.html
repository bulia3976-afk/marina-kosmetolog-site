<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Марина — косметология и естественное восстановление</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-x: none;
    }

    iframe {
      display: block;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      overflow-x: hidden;
    }
  </style>
</head>

<body>
  <iframe
    id="marina-site"
    src="site-original-style-safe.html"
    title="Сайт Марины">
  </iframe>

  <script>
    const frame = document.getElementById('marina-site');

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const style = doc.createElement('style');

        style.textContent = `
          html, body {
            width: 100% !important;
            max-width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
          }

          *, *::before, *::after {
            box-sizing: border-box;
          }

          img, picture, video, svg, canvas {
            max-width: 100% !important;
          }
        `;

        doc.head.appendChild(style);
      } catch (e) {}
    });
  </script>
</body>
</html>
